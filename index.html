<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart - All Subjects Learning Hub (Nursery to 10th)</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .kids-font {
            font-family: 'Fredoka', cursive;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">
    <!-- TOP ADVERT BANNER -->
    <div class="bg-amber-100 dark:bg-amber-950/60 text-amber-900 dark:text-amber-200 text-xs px-4 py-2 text-center border-b border-amber-200 dark:border-amber-900 flex flex-wrap items-center justify-center gap-2">
        <span>EduSmart Pro Subscription at 50% OFF! Learn Without Ads.</span>
        <button onclick="openSubscriptionModal()" class="underline font-bold text-indigo-600 dark:text-indigo-400">Upgrade Now</button>
    </div>

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchGrade('nursery')">
                <div class="w-10 h-10 rounded-xl bg-brand-500 text-white flex items-center justify-center font-bold text-xl kids-font shadow-md">
                    ES
                </div>
                <div>
                    <h1 class="kids-font text-xl sm:text-2xl text-indigo-600 dark:text-indigo-400 leading-none">EduSmart Hub</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-semibold mt-0.5">Nursery to Class 10th (All Subjects)</p>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full">
        <div class="text-center py-12">
            <h2 class="text-3xl kids-font font-bold mb-4">Welcome to EduSmart Kids Learning Hub!</h2>
            <p class="text-slate-600 dark:text-slate-400">Select your grade and start learning fun subjects today.</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 EduSmart Kids Learning Hub. All rights reserved. | <a href="./privacy.html" class="underline">Privacy Policy</a></p>
    </footer>

    <script>
        function switchGrade(grade) {
            console.log("Switched to grade:", grade);
        }
        function openSubscriptionModal() {
            alert("Subscription modal coming soon!");
        }
    </script>
</body>
</html>
